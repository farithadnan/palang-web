# Static file serving for the SPA. Caching split: hashed assets are immutable
# (cache-busted by filename), index.html + manifests are always revalidated so
# a deploy is picked up within seconds. The previous bundle generation is kept
# in dist by the build, so a stale index.html resolves instead of 404ing.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
    }
    location = /limits.json {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
