[package]
name = "palang"
version = "0.3.1"
description = "Convert, stamp and merge documents — fully offline"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Explicit lib target: main.rs calls palang_lib::run(). crate-type includes
# the static/cdylib forms so a future mobile (Android/iOS) build can link it.
[lib]
name = "palang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
# Native save: dialog = Save-as window, fs = write to the chosen path. The web
# view cannot download a blob (the file silently vanishes), so the packaged
# Windows build saves through these instead.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
