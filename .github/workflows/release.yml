name: Release

# One workflow, one release, fully automated.
#
# `release-please` reads Conventional Commits on `main` and keeps a release PR
# open (bumping package.json, src-tauri/Cargo.toml, and CHANGELOG.md). Merging
# that PR is the only step a human takes: it creates the version tag and a
# *draft* GitHub Release. This same run then builds both platforms, attaches the
# binaries, and only then publishes the release — so a release is never visible
# without its downloads.
#
# Why not trigger on tag pushes? Tags created by release-please use GITHUB_TOKEN,
# and GITHUB_TOKEN-generated events do not start new workflow runs. Building
# here, in the same run, avoids needing a personal access token.
#
# Manual dispatch (no release) just builds the artifacts for testing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags/draft releases, upload assets, publish
  pull-requests: write # open and update the release PR
  issues: write # release-please applies its lifecycle labels

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  windows:
    needs: release-please
    # Build when a release was just cut, or for a manual test build.
    if: always() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      # Check out the release commit (its package.json holds the new version),
      # or the dispatched ref for a manual build.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # tauri-action sets up Rust and runs `npm run tauri build` (which runs
      # `npm run build:app`). It only builds — the release already exists.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Attach installers to the release
        if: needs.release-please.outputs.released == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag }}" \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe \
            --clobber

  android:
    needs: release-please
    if: always() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 requires JDK 21+ (17 fails javac init)
      - run: npm ci
      - run: npm run build:app
      - name: Generate + sync the Android platform
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#111111'
          npx cap sync android
      - name: Build APK (debug-signed — installable by sideload)
        run: cd android && ./gradlew assembleDebug
      - name: Give the APK a proper name
        run: |
          V=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Palang_${V}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Attach APK to the release
        if: needs.release-please.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" android/app/build/outputs/apk/debug/*.apk --clobber

  publish:
    # Publish only once the release exists AND both platforms built cleanly, so
    # the release is never visible without its downloads.
    needs: [release-please, windows, android]
    if: needs.release-please.outputs.released == 'true' && needs.windows.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.release-please.outputs.tag }}" \
            --draft=false \
            --latest
