name: Release

# One workflow, one release. On a version tag both platform builds run, then a
# single `publish` job attaches the EXE/MSI and the APK to one draft release —
# no two workflows racing to create the same release.
#
# Manual dispatch (no tag) builds the same artifacts and stops there: download
# them from the run's Artifacts section to test without cutting a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release / attach assets on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # tauri-action sets up Rust and runs `npm run tauri build` (which runs
      # `npm run build:app`). It only builds here — the `publish` job owns the
      # release, so there is exactly one place that creates it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 requires JDK 21+ (17 fails javac init)
      - run: npm ci
      - run: npm run build:app
      - name: Generate + sync the Android platform
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#111111'
          npx cap sync android
      - name: Build APK (debug-signed — installable by sideload)
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  publish:
    # Tag pushes publish; manual dispatch only produces test artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Palang ${{ github.ref_name }}
          files: dist-artifacts/*
          body: |
            Prepare documents for sharing: convert photos to one PDF, stamp a
            palang purpose band, and merge PDFs. Everything runs on your device.
            Nothing is uploaded, nothing is stored on a server, and there are no
            accounts.

            ## Downloads

            | File | What it is |
            | --- | --- |
            | `Palang_x.x.x_x64-setup.exe` | Windows installer (recommended) |
            | `Palang_x.x.x_x64_en-US.msi` | Windows installer for managed / silent installs |
            | `app-debug.apk` | Android app. Debug-signed, so Android asks you to allow installs from this source |

            ## Install notes

            - **Windows:** run the installer and follow the prompts, then open
              Palang from the Start menu. It works offline.
            - **Android:** open the APK on the device that will run it, allow the
              install when asked, and open Palang. It works offline.
            - Both builds are packaged from the same codebase and the same
              on-device PDF engine, so the documents they produce are identical.

            ## Updates

            The app checks a small version file when it opens and offers to
            update when a newer build exists. It is the only network request the
            app makes; your documents never leave the device.

            ## License

            MIT. The source, the issue tracker and this release live in the same
            repository.
