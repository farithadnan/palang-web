name: Package EXE (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # tauri-action creates the release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # tauri-action runs `npm run tauri build` (which runs npm run build:app
      # from tauri.conf.json). On tag pushes it creates the release; on manual
      # dispatch (no tag) it only builds + uploads the bundle as artifacts —
      # release creation needs a tag ref, otherwise GITHUB_TOKEN refuses it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'Palang v__VERSION__' || '' }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: false
          releaseBody: |
            Prepare documents for sharing: convert photos to one PDF, stamp a
            palang purpose band, and merge PDFs. Everything runs on your device.
            Nothing is uploaded, nothing is stored on a server, and there are no
            accounts.

            ## Downloads

            | File | What it is |
            | --- | --- |
            | `Palang_x.x.x_x64-setup.exe` | Windows installer (recommended) |
            | `Palang_x.x.x_x64_en-US.msi` | Windows installer for managed / silent installs |
            | `app-debug.apk` | Android app. Debug-signed, so Android asks you to allow installs from this source |

            ## Install notes

            - **Windows:** run the installer and follow the prompts, then open
              Palang from the Start menu. It works offline.
            - **Android:** open the APK on the device that will run it, allow the
              install when asked, and open Palang. It works offline.
            - Both builds are packaged from the same codebase and the same
              on-device PDF engine, so the documents they produce are identical.

            ## Updates

            The app checks a small version file when it opens and offers to
            update when a newer build exists. It is the only network request the
            app makes; your documents never leave the device.

            ## License

            MIT. The source, the issue tracker and this release live in the same
            repository.
      # tauri-action only uploads when publishing a release; on dispatch runs
      # the bundle must be surfaced explicitly so it can be tested.
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: palang-windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
