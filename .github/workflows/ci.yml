name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Both variants must stay green: the app variant is what the EXE and APK
      # are packaged from, the site is what deploys. The site goes LAST because
      # both write to dist/ (the last build wins).
      - run: npm run build:app
      - run: npm run build
