name: Package APK (Android)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to attach the APK to the release on tag pushes

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 requires JDK 21+ (17 fails javac init)
      - run: npm ci
      - run: npm run build:app
      - name: Generate + sync the Android platform
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#111111'
          npx cap sync android
      - name: Build APK (debug-signed — installable by sideload)
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: palang-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      # On a tag push the APK belongs ON the release next to the EXE/MSI —
      # otherwise the site's download buttons point at a release that only
      # carries the Windows installer and users have to dig through Actions
      # artifacts. The Windows workflow may still be creating the (draft)
      # release when this runs, so wait briefly, then create-or-upload.
      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          for i in $(seq 1 12); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Palang $TAG"
          gh release upload "$TAG" android/app/build/outputs/apk/debug/*.apk --clobber
